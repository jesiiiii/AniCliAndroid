name: build APK
# Rebuild the merged Uchiha Anime UI as one installable release APK.

on:
  push:
    branches: [ main, master, feature/safe-playback-improvements, feature/ios26-motion, feature/uchiha-motion-upgrade ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: use preinstalled android sdk and accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list | head -5

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uchiha-Anime-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: attach APK to release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Uchiha Anime build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
          body: |
            نسخة APK جاهزة للتثبيت، مبنية تلقائياً من آخر التغييرات على الفرع الرئيسي.
